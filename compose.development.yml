services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: rise
      POSTGRES_USER: rise
      POSTGRES_PASSWORD: rise-development-only
    ports:
      - "5432:5432"
    volumes:
      - rise-development-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rise -d rise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rise-development-data:
